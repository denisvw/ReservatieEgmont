# Gratis Supabase-projecten worden gepauzeerd na een week zonder activiteit.
# Deze taak doet elke 3 dagen een kleine aanvraag zodat de site altijd werkt.
# Ze leest de gegevens uit site/js/config.js; er zijn geen geheimen nodig.
name: Supabase wakker houden
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' site/js/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' site/js/config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
