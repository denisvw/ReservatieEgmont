# Fly.io-configuratie. Pas "app" aan naar een unieke naam; de site komt dan op
# https://<app>.fly.dev  (geen eigen domeinnaam nodig).
app = "appartement-zee"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8080"
  WHATSAPP_PROVIDER = "callmebot"

[mounts]
  source = "reservaties_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
